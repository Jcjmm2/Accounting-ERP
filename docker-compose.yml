# =========================================================================
# Stack de producción Tyted — web (nginx) + api (.NET) + tyted-db (PostgreSQL) + backup
# Diseño de seguridad:
#   - Solo 'web' publica puertos (8080). 'api' y 'tyted-db' viven en la red
#     interna del compose: no hay ningún puerto de BD/API expuesto afuera.
#   - Los secretos NO están aquí: llegan por interpolación de variables
#     (.env en local, variables de entorno en Coolify). Ver .env.example
#   - healthchecks en los tres servicios clave; el arranque es en orden
#     (postgres healthy → api healthy → web).
# =========================================================================

name: tyted

services:
  web:
    build:
      context: ./Tyted.Frontend
    ports:
      # Local: 8080 por defecto. En el servidor Coolify define WEB_HOST_PORT=18080
      # porque el puerto 8080 del host ya lo ocupa coolify-proxy (choque al hacer up).
      - "${WEB_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./Tyted.API
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Host 'tyted-db' = alias de red EXCLUSIVO del postgres del stack.
      # NO usar 'postgres': en la red compartida con Coolify, 'postgres' también
      # resuelve a coolify-db (su servicio interno) y la API recibía 28P01 del
      # servidor equivocado (incidente 25/10/2026).
      ConnectionStrings__DefaultConnection: "Host=tyted-db;Port=5432;Database=Tyted;Username=postgres;Password=${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD (define .env o las variables en Coolify)}"
      Jwt__Key: "${JWT_KEY:?Falta JWT_KEY (mínimo 32 caracteres)}"
      AllowedOrigins__0: "${APP_ORIGIN:-http://localhost:8080}"
      ADMIN_SEED_PASSWORD: "${ADMIN_SEED_PASSWORD:-}"
    depends_on:
      tyted-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # SERVICIO RENOMBRADO de 'postgres' a 'tyted-db' (incidente 25/10/2026):
  # el nombre 'postgres' es ambiguo en la red compartida con Coolify (también
  # lo resuelve coolify-db) y la API recibía 28P01 del servidor equivocado.
  # Coolify IGNORA los aliases de red del compose pero SÍ registra el nombre
  # de SERVICIO del contenedor en todas las redes a las que lo conecta, así
  # que 'tyted-db' resuelve único en cualquier topología. El volumen pgdata
  # no cambia (es del proyecto, no del servicio): los datos se conservan.
  tyted-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD (define .env o las variables en Coolify)}"
      POSTGRES_DB: Tyted
    volumes:
      # postgres:18+ usa layout con subdirectorio por versión mayor: el volumen
      # se monta en /var/lib/postgresql (NO en .../data, que es legacy y la
      # imagen lo rechaza con error). Los datos quedan en /var/lib/postgresql/18/.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Tyted"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Backup diario de la BD (pg_dump → /backups → subida a Cloudflare R2)
  backup:
    build:
      context: ./docker/backup
    depends_on:
      tyted-db:
        condition: service_healthy
    environment:
      # Nombre de servicio 'tyted-db' (ver nota en el servicio tyted-db)
      PGHOST: tyted-db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD (define .env o las variables en Coolify)}"
      PGDATABASE: Tyted
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-7}"
      # Off-site en Cloudflare R2 (API S3). Si se vacían, backup solo local.
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-auto}"
      S3_BUCKET: "${S3_BUCKET:-tyted-backups}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_KEEP_DAYS: "${S3_KEEP_DAYS:-30}"
      # Monitor Push de Uptime Kuma (vacío = sin heartbeat de backup)
      BACKUP_PUSH_URL: "${BACKUP_PUSH_URL:-}"
    volumes:
      - backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: unless-stopped

  # pgAdmin de gestión — SOLO arranca con: docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@tyted.net"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:?Falta PGADMIN_PASSWORD (en Coolify)}"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      # Solo localhost del servidor: se accede por túnel SSH, nunca expuesto a internet
      - "127.0.0.1:8888:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  pgdata:
  backups:
  pgadmin_data:
