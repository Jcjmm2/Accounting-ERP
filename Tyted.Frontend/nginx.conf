# =========================================================================
# nginx.conf de producción — frontend React (SPA) + proxy /api → api:8080
# Corre como usuario NO root (USER nginx en el Dockerfile): por eso pid y
# temporales viven en /tmp y se escucha en 8080 (puerto no privilegiado).
# =========================================================================

worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'cf_ip=$http_cf_connecting_ip';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Temporales en /tmp: el usuario nginx no puede escribir en /var/cache/nginx
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Tamaño máximo de petición (mismo límite que la API: anti payloads gigantes)
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Rate limiting por cliente (primera línea anti-flood L7) ---
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # --- IP real detrás de proxies en redes privadas (Docker / Coolify) ---
    # INCIDENTE 25/10/2026 (Fase A): el coolify-proxy (Traefik) DESCARTA la IP
    # del cliente del X-Forwarded-For de Cloudflare (en los logs llegaba solo la
    # IP del borde CF, rotativa) → el rate limit de login se particionaba por
    # IP de borde y NUNCA aplicaba 429. Solución: usar el header CF-Connecting-IP
    # que Cloudflare envía en todas las peticiones y que Traefik no modifica
    # (el peer directo es Traefik, en red privada → confiable).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    include /etc/nginx/cf-realip.conf;

    # DNS embebido de Docker: nginx resuelve api:8080 en tiempo de petición y
    # no falla al arrancar si el contenedor de la API aún no está listo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;

        # --- Cabeceras de seguridad ---
        # NOTA: nginx no hereda add_header a locations que declaran los suyos,
        # por eso se repiten en cada bloque que añade Cache-Control.
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --- HTML: siempre sin caché para que cada deploy se vea reflejado ---
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options    "nosniff" always;
            add_header X-Frame-Options           "DENY" always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # --- Assets con hash de Vite: caché agresiva ---
        location /assets/ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options    "nosniff" always;
            add_header X-Frame-Options           "DENY" always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # --- API: proxy al contenedor api (red interna, sin puertos públicos) ---
        location /api/ {
            limit_req  zone=api_limit burst=30 nodelay;
            limit_conn addr_limit 50;

            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # --- Health check del orquestador ---
        location = /health {
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream/health;
            access_log off;
            add_header Cache-Control "no-store" always;
        }

        # --- SPA: todo lo demás es index.html (rutas de React Router) ---
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
